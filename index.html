<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131528">
<meta name="color-scheme" content="dark light">
<title>Karate-Ka Companion</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap">
<script>try{var t=localStorage.getItem("kc.theme");if(t==="light")document.documentElement.dataset.theme="light";}catch(e){}</script>
<style>
/* Karate-Ka Companion: one-column phone app. Starts dark; light is a choice in the account panel.
   Palette: midnight navy ground, periwinkle accent, blush cheeks, and a soft tint per note type. */
:root{--f:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;--navh:72px}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#131528;--surface:#1E2140;--sunk:#282C4F;--ink:#EEF0FA;--muted:#A9AECB;--line:#2F3459;
  --accent:#8C9BFF;--accent-ink:#121535;--hero:#262B57;--hero-ink:#EEF0FA;--hero-muted:#B8BEE6;
  --head:#E86A86;--danger:#FF8F8F;--ok:#86E0B5;--ring:rgba(140,155,255,.65);--scrim:rgba(5,6,15,.66);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.40);
  --kata-f:#262E63;--kata-i:#B4BEFF;--kihon-f:#45321A;--kihon-i:#FFC979;--kumite-f:#4A1F2E;--kumite-i:#FF9DB3;
  --sensei-f:#173D30;--sensei-i:#86E0B5;--goals-f:#382556;--goals-i:#D3A8FF;--general-f:#2A2E48;--general-i:#C9CDE0;
  --goal-f:#3D3315;--goal-i:#FFD66B;--work-f:#3A2219;--work-t:#45261C;--work-i:#FFB08C;--work-c:#FF9A6B;
  --fu-f:#16344A;--fu-i:#9AD6FF;--fu-c:#7CC8FF;--fu-line:#4E8DBA;--as-f:#382556;--as-i:#D3A8FF;--as-c:#C9A8FF;
  --late-f:#4A1F2E;--late-i:#FF9DB3;--late-line:#6B2C40}
:root[data-theme="light"]{color-scheme:light;
  --bg:#F2F3F7;--surface:#FFFFFF;--sunk:#E8EAF1;--ink:#1E2235;--muted:#5B6075;--line:#E1E4EE;
  --accent:#3B4BA8;--accent-ink:#FFFFFF;--hero:#1E2235;--hero-ink:#FFFFFF;--hero-muted:#C9CEE6;
  --head:#D9485F;--danger:#C0392B;--ok:#1F6B48;--ring:rgba(59,75,168,.45);--scrim:rgba(20,24,40,.45);
  --shadow:0 1px 2px rgba(30,34,53,.06),0 8px 24px rgba(30,34,53,.10);
  --kata-f:#E6E9FB;--kata-i:#2F3C8F;--kihon-f:#FFF0D9;--kihon-i:#7A4A00;--kumite-f:#FDE4EA;--kumite-i:#9A2645;
  --sensei-f:#E2F4EC;--sensei-i:#1F6B48;--goals-f:#F1E6FB;--goals-i:#643592;--general-f:#E4E6EE;--general-i:#3A3F55;
  --goal-f:#FFF1C7;--goal-i:#7A5A00;--work-f:#FFE7DC;--work-t:#FFD5C2;--work-i:#9C3E14;--work-c:#FF9A6B;
  --fu-f:#E0F1FC;--fu-i:#1D5E8A;--fu-c:#7CC8FF;--fu-line:#5FA3D4;--as-f:#F1E6FB;--as-i:#643592;--as-c:#C9A8FF;
  --late-f:#FDE4EA;--late-i:#9A2645;--late-line:#F2B5C4}
.t-kata{--tf:var(--kata-f);--ti:var(--kata-i)} .t-kihon{--tf:var(--kihon-f);--ti:var(--kihon-i)}
.t-kumite{--tf:var(--kumite-f);--ti:var(--kumite-i)} .t-sensei{--tf:var(--sensei-f);--ti:var(--sensei-i)}
.t-goals{--tf:var(--goals-f);--ti:var(--goals-i)} .t-general{--tf:var(--general-f);--ti:var(--general-i)}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;transition:background-color .2s ease}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
button:disabled{cursor:default;opacity:.55}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{max-width:560px;margin:0 auto;padding-bottom:calc(var(--navh) + 110px + env(safe-area-inset-bottom))}

/* tap feedback: dip while held, then a ring pulses out */
button,.tile span,.pillr span{transition:transform .12s ease,filter .12s ease,background-color .15s ease}
.tapping{transform:scale(.95);filter:brightness(1.2)}
.tapped{animation:ring .45s ease-out}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--ring)}100%{box-shadow:0 0 0 12px rgba(0,0,0,0)}}

/* header */
.top{display:flex;align-items:center;gap:10px;padding:calc(18px + env(safe-area-inset-top)) 18px 8px}
.top .ttl{flex:1;min-width:0}
.top h1{margin:0;font-size:21px;font-weight:900;letter-spacing:-.2px;line-height:1.1}
.sub{font-size:13px;font-weight:700;color:var(--muted)}
.sync.bad{color:var(--danger)}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--surface);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);flex-shrink:0}
.ibtn svg{width:22px;height:22px}
.avatar{font-weight:900;font-size:17px;color:var(--accent)}

.pad{padding:0 18px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:16px;padding:0 14px;height:46px;margin:6px 18px 0}
.search input{border:none;outline:none;background:transparent;font-size:15px;font-weight:600;flex:1;min-width:0;height:100%}
.search svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.chips{display:flex;gap:8px;padding:12px 18px 4px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:38px;padding:0 15px;border-radius:19px;background:var(--tf,var(--surface));color:var(--ti,var(--ink));font-size:14px;font-weight:800;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1}
.sbtn{height:40px;padding:0 12px;border-radius:14px;background:var(--surface);display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:800}
.sbtn svg{width:18px;height:18px}

.list{display:flex;flex-direction:column;gap:12px;padding:12px 18px 0}
.dhead{margin:6px 0 -4px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.note{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.ico{width:44px;height:44px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--tf);color:var(--ti)}
.ico svg{width:32px;height:32px}
.nbody{flex:1;min-width:0;display:block}
.meta{display:block;font-size:12px;font-weight:800;color:var(--muted)}
.meta b{color:var(--ti);font-weight:900}
.ntitle{display:block;font-size:16px;font-weight:800;margin-top:2px}
.nsnip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;font-weight:600;color:var(--muted);margin-top:3px;line-height:1.35}
.pin{width:16px;height:16px;color:var(--accent);flex-shrink:0;margin-top:2px}

.hero{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--work-f);color:var(--ink);border-radius:20px;padding:12px 14px}
.hero .lbl{font-size:12px;font-weight:800;color:var(--work-i)}
.hero .big{font-size:16px;font-weight:800}
.hero svg.star{width:38px;height:38px;flex-shrink:0}
.hero .go{width:20px;height:20px;color:var(--work-i);flex-shrink:0}
.heroes{display:flex;flex-direction:column;gap:8px;padding:8px 18px 0}

/* markers (Gary, Oct 21): each has its own symbol, colour and shape.
   Goal = gold star, solid pill · Working on = coral flame, solid pill · Follow up = sky bell, dashed outline ·
   Assignment = lavender clipboard, square tag with its due day */
.mk{display:inline-flex;align-items:center;margin-left:6px;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:900;vertical-align:1px;white-space:nowrap}
.mk-goal{background:#FFD66B;color:#3A2A00}
.mk-work{background:var(--work-c);color:#3A1606}
.mk-fu{border:1.5px dashed var(--fu-c);color:var(--fu-i);padding:0 7px}
.mk-as{border-radius:6px;border:1px solid var(--as-c);background:var(--as-f);color:var(--as-i)}
.mk-as.mk-late{border-color:var(--late-i);background:var(--late-f);color:var(--late-i)}
.sec{display:flex;align-items:center;gap:6px;margin:16px 18px 0;font-size:12px;font-weight:900;letter-spacing:.7px;text-transform:uppercase}
.sec svg{width:18px;height:18px}
.sec-work{color:var(--work-i)}
.sec-fu{color:var(--fu-i)}
.fus{display:flex;flex-direction:column;gap:8px;padding:8px 18px 0}
.fu{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--fu-line);border-radius:16px;padding:5px 5px 5px 12px}
.fu .fubody{flex:1;min-width:0;text-align:left;padding:4px 0}
.fu .who{display:block;font-size:11px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;color:var(--fu-i)}
.fu .big{display:block;font-size:15px;font-weight:800}
.tick{width:44px;height:44px;border-radius:12px;background:var(--fu-f);color:var(--fu-i);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tick svg{width:20px;height:20px}

.empty{text-align:center;padding:40px 24px;color:var(--muted);font-weight:700}
.empty svg{width:96px;height:96px;display:block;margin:0 auto 12px}

/* bottom nav + add button */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-around;height:var(--navh)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:64px;padding:0 4px;font-size:12px;font-weight:800;color:var(--muted);border-radius:16px}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--accent)}
.fab{position:fixed;z-index:6;right:max(18px,calc(50vw - 262px));bottom:calc(var(--navh) + 20px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:22px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.fab svg{width:28px;height:28px}

/* kata */
.kcat{margin:14px 0 -2px;font-size:17px;font-weight:900;color:var(--ink)}
.kcat:first-child{margin-top:4px}
.kbelt{display:flex;align-items:center;gap:8px;margin:6px 0 -4px;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.kbelt i{width:24px;height:8px;border-radius:4px;background:var(--b);box-shadow:inset 0 0 0 1px rgba(140,140,160,.45)}
.krow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border-radius:18px;padding:12px 14px;min-height:64px}
.knum{width:30px;font-size:13px;font-weight:900;color:var(--muted);text-align:center;flex-shrink:0}
.kname{display:block;font-size:16px;font-weight:800}
.ken{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.badges{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.badge{font-size:12px;font-weight:800;border-radius:9px;padding:2px 8px;background:var(--sunk);color:var(--muted)}
.badge.s-Learning{background:var(--kihon-f);color:var(--kihon-i)}
.badge.s-Polishing{background:var(--kata-f);color:var(--kata-i)}
.badge.s-Solid{background:var(--sensei-f);color:var(--sensei-i)}
.khero{margin:6px 18px 0;background:var(--kata-f);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px}
.khero h1{margin:0;font-size:26px;font-weight:900;line-height:1.1}
.khero .en{font-size:14px;font-weight:700;color:var(--kata-i)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:var(--surface);border-radius:16px;padding:4px}
.seg button{height:40px;border-radius:12px;font-size:14px;font-weight:800;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.kiai{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:8px 8px 8px 12px}
.kiai .n{font-size:24px;font-weight:900;line-height:1.1}
.kiai svg{width:34px;height:34px;flex-shrink:0}
.kdet{background:var(--surface);border-radius:16px;overflow:hidden}
.kdet-h{display:flex;align-items:center;gap:8px;width:100%;min-height:48px;padding:0 14px;font-size:15px;font-weight:800;text-align:left}
.kdet-c{font-size:12px;font-weight:800;color:var(--muted)}
.kdet .chev{width:18px;height:18px;display:inline-flex;transition:transform .2s}
.kdet-h[aria-expanded="true"] .chev{transform:rotate(180deg)}
.klist{list-style:none;margin:0;padding:0 14px 6px}
.klist li{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:15px;font-weight:700}
.kn{width:26px;height:26px;border-radius:13px;background:#FFD66B;color:#1E2235;font-size:13px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.kdet .mini{margin:2px 14px 12px}
.step{width:44px;height:44px;border-radius:14px;background:var(--sunk);font-size:24px;font-weight:900}
.step.plus{background:var(--accent);color:var(--accent-ink)}
.box{margin:14px 18px 0;background:var(--surface);border-radius:20px;padding:14px 16px}
.box h2,.h2{margin:0 0 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.rem{display:flex;gap:10px;align-items:flex-start;font-size:15px;font-weight:700;padding:3px 0}
.rem i{width:8px;height:8px;border-radius:4px;background:#F4A6B5;margin-top:7px;flex-shrink:0}
.tl{display:flex;gap:12px}
.tl .rail{display:flex;flex-direction:column;align-items:center;width:14px}
.tl .dot{width:14px;height:14px;border-radius:7px;background:var(--ti);border:3px solid var(--bg);margin-top:4px}
.tl .line{flex:1;width:2px;background:var(--line)}
.tl button{flex:1;text-align:left;padding-bottom:14px;min-width:0}
.tag{display:inline-block;border-radius:8px;padding:1px 8px;margin-left:6px;background:var(--tf);color:var(--ti)}
.backrow{display:flex;align-items:center;gap:8px;padding:calc(16px + env(safe-area-inset-top)) 18px 8px}

/* goals */
.goal{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-radius:18px;padding:12px}
.check{width:44px;height:44px;border-radius:14px;background:var(--goal-f);color:var(--goal-i);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.check svg{width:24px;height:24px}
.check[aria-pressed="true"]{background:var(--sensei-f);color:var(--sensei-i)}
.goal .nbody{text-align:left;padding-top:2px}
.goal.done .ntitle{text-decoration:line-through;color:var(--muted)}

/* assignments */
.as{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border-radius:20px;padding:12px 14px;box-shadow:var(--shadow);border:1.5px solid transparent}
.as.late{border-color:var(--late-line)}
.as .ico,.ico.as-ico{background:var(--as-f)}
.as .row1{display:flex;align-items:center;gap:8px}
.as .row1 .meta{flex:1;min-width:0}
.as .mk{margin-left:0}
.as.done .ntitle{text-decoration:line-through;color:var(--muted)}
.prog{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;font-weight:800;color:var(--muted)}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:block}
.prog i b{display:block;height:100%;background:var(--as-c);border-radius:3px}
.dhead.g-late{color:var(--late-i)}
.dhead.g-soon{color:var(--as-i)}
.atitle{display:flex;gap:12px;align-items:flex-start}
.atitle h3{margin:2px 0 0;font-size:22px;font-weight:900;line-height:1.2;text-wrap:balance}
.ico.big{width:56px;height:56px;border-radius:18px}
.ico.big svg{width:42px;height:42px}
.afacts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.fact{background:var(--surface);border-radius:16px;padding:10px 12px;text-align:left;min-width:0}
.fact small{display:block;font-size:11px;font-weight:900;letter-spacing:.5px;color:var(--muted);text-transform:uppercase}
.fact b{display:block;font-size:15px;font-weight:800}
.fact.due{background:var(--as-f);box-shadow:inset 0 0 0 1px var(--as-c)}
.fact.due small{color:var(--as-i)}
.fact.late{background:var(--late-f);box-shadow:inset 0 0 0 1px var(--late-i)}
.fact.late small{color:var(--late-i)}
.fact.kata{grid-column:1/-1;background:var(--kata-f)}
.fact.kata small{color:var(--kata-i)}
.steps{background:var(--surface);border-radius:20px;padding:10px 14px;margin-top:12px}
.stp{display:flex;align-items:center;gap:12px;min-height:44px;width:100%;text-align:left;font-size:15px;font-weight:700;border-radius:10px}
.stp .bx{width:24px;height:24px;border-radius:8px;border:2px solid var(--as-c);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#24123F}
.stp .bx svg{width:16px;height:16px}
.stp[aria-pressed="true"] .bx{background:var(--as-c)}
.stp[aria-pressed="true"] .tx{text-decoration:line-through;color:var(--muted)}
.btn.ok{background:var(--ok);color:#0D2E21;font-weight:900}
[data-theme=light] .btn.ok{color:#FFFFFF}
.btn.ok svg{width:20px;height:20px}
.opt.as-link{background:var(--as-f);color:var(--as-i);gap:10px}
.opt.as-link svg{width:24px;height:24px}
.opt.fu-link{background:var(--fu-f);color:var(--fu-i);gap:10px}
.fab.fab-as{background:var(--as-c);color:#24123F}
.dotn{position:absolute;top:6px;right:10px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--head);color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}
/* marker switches in the note form */
.mrow{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:8px 14px 8px 8px;margin-top:8px;font-weight:800}
.mrow .mi{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--mf);color:#1E2235}
.mrow .mi svg{width:28px;height:28px}
.mrow .nm{display:block;font-size:15px;color:var(--mc)}
.mrow input[type=checkbox]{width:22px;height:22px;accent-color:var(--mk);flex-shrink:0}
.m-goal{--mf:var(--goal-f);--mc:var(--goal-i);--mk:#FFD66B}
.m-work{--mf:var(--work-t);--mc:var(--work-i);--mk:var(--work-c)}
.m-fu{--mf:var(--fu-f);--mc:var(--fu-i);--mk:var(--fu-c)}
.fubox{margin-top:8px;border-radius:16px;background:var(--surface);border:1.5px dashed transparent}
.fubox .mrow{margin-top:0;background:transparent}
.fubox .who{display:none;gap:6px;flex-wrap:wrap;padding:0 12px 10px 60px}
.fubox:has(input[name=followUp]:checked){background:var(--fu-f);border-color:var(--fu-c)}
.fubox:has(input[name=followUp]:checked) .mi{background:var(--surface)}
.fubox:has(input[name=followUp]:checked) .who{display:flex}
.who .pillr span{height:36px;padding:0 12px;font-size:13px}

/* panels */
#sheetWrap{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
#sheetWrap[hidden]{display:none}
.sheet{width:100%;max-width:560px;max-height:92dvh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:14px 18px calc(24px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
.shead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.shead h2{flex:1;margin:0;font-size:20px;font-weight:900}
.btn{height:48px;padding:0 20px;border-radius:15px;font-size:16px;font-weight:800;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btns .btn{flex:1 1 0}
.btns.col{flex-direction:column}
.btns.col .btn{flex:none}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px;min-width:0}
.field>span,.legend{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.3px}
.inp{width:100%;border:none;outline:none;background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px;font-weight:700}
textarea.inp{resize:vertical;min-height:120px;line-height:1.45;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile input,.pillr input{position:absolute;opacity:0;pointer-events:none}
.tile span{height:66px;border-radius:18px;border:2.5px solid transparent;background:var(--tf);color:var(--ti);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:800}
.tile span svg{width:28px;height:28px}
.tile input:checked+span{border-color:var(--ti)}
.tile input:focus-visible+span,.pillr input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pillr span{display:inline-flex;align-items:center;height:42px;padding:0 16px;border-radius:21px;border:2px solid var(--line);background:var(--surface);font-size:14px;font-weight:800}
.pillr input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.swrow{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:12px 14px;margin-top:14px;font-weight:800}
.swrow input{width:22px;height:22px;accent-color:var(--accent)}
.goalrow .star{width:30px;height:30px;flex-shrink:0;color:#1E2235}
.swsub{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:2px}
.savebar{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom));display:flex;gap:10px;margin:18px -18px calc(-24px - env(safe-area-inset-bottom));padding:12px 18px calc(14px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);z-index:2}
.savebar .btn{flex:1 1 0}
.savebar .btn.save{flex:2 1 0;background:var(--ok);color:#0D2E21;border-color:transparent;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:8px}
[data-theme=light] .savebar .btn.save{color:#FFFFFF}
.savebar .btn.save svg{width:20px;height:20px}
/* ---------- big screens: sidebar (sections, note types, settings) · full-width list · docked note panel ---------- */
.nbrand,.nside,.nfoot{display:none}
@media (min-width:1000px){
  :root{--side:248px;--pane:clamp(360px,30vw,500px)}
  #app{max-width:none;margin:0 var(--pane) 0 var(--side);padding:8px 36px 80px}
  .nav{top:0;bottom:0;right:auto;width:var(--side);border-top:0;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
  .nbrand{display:flex;align-items:center;gap:10px;padding:0 6px 16px;font-weight:900;font-size:17px;line-height:1.15}
  .nav .in{flex-direction:column;justify-content:flex-start;height:auto;gap:4px;max-width:none;margin:0}
  .tab{flex-direction:row;justify-content:flex-start;gap:12px;width:100%;min-height:46px;padding:0 14px;font-size:15px;border-radius:14px}
  .tab svg{width:22px;height:22px}
  .tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
  .tab:hover:not([aria-selected="true"]),.ntype:hover:not([aria-pressed="true"]),.nset:hover{background:var(--line)}
  .nside{display:flex;flex-direction:column;gap:2px;margin-top:14px}
  .nnew{width:100%;margin-bottom:14px}
  .nnew svg{width:20px;height:20px}
  .nhead{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 10px 6px}
  .ntype{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:4px 10px;border-radius:12px;font-size:14px;font-weight:800;color:var(--ink);text-align:left}
  .ntype .ico{width:32px;height:32px;border-radius:10px}
  .ntype .ico svg{width:24px;height:24px}
  .t-all{--tf:var(--line);--ti:var(--ink)}
  .ntype .cnt{font-size:12px;font-weight:800;color:var(--muted)}
  .ntype[aria-pressed="true"]{background:var(--tf);color:var(--ti)}
  .ntype[aria-pressed="true"] .cnt{color:inherit}
  .nfoot{display:block;margin-top:auto;padding-top:14px}
  .nset{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:14px;background:var(--surface);text-align:left}
  .nset b{display:block;font-size:14px;font-weight:900}
  .nset .sub{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
  .nav-av{width:36px;height:36px;border-radius:50%;flex-shrink:0;background:var(--head);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center}
  .typechips,.fab,.top .ibtn,.top>svg,.top .ttl h1{display:none}
  .heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .note,.hero,.goal .nbody,.opt,.as,.fu .fubody{cursor:pointer}
  .note:hover,.hero:hover,.as:hover{filter:brightness(1.08)}
  .note.active,.hero.active,.krow.active,.as.active{outline:2px solid var(--accent);outline-offset:-2px}
  .fu .fubody.active{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
  .dotn{position:static;margin-left:auto}
  .krow{cursor:pointer}
  .krow:hover{filter:brightness(1.08)}
  .kpanehead{gap:10px}
  .goal .nbody.active{outline:2px solid var(--accent);outline-offset:4px;border-radius:12px}
  .toast{left:calc(var(--side) + (100vw - var(--side) - var(--pane)) / 2);bottom:32px;width:min(520px,calc(100vw - var(--side) - var(--pane) - 48px))}
  #sheetWrap,#sheetWrap[hidden]{display:flex;position:fixed;top:0;right:0;bottom:0;left:auto;width:var(--pane);z-index:4;background:var(--bg);border-left:1px solid var(--line);align-items:stretch;justify-content:stretch}
  .sheet{max-width:none;width:100%;height:100dvh;max-height:none;border-radius:0;background:var(--bg);padding:22px 24px 24px;animation:none}
  .savebar{margin:18px -24px -24px;padding:14px 24px 18px;bottom:-24px}
  .pane-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-weight:700;text-align:center}
  .pane-empty .m{width:72px;height:72px;opacity:.8}
  .pane-empty p{margin:0}
  .kbd-hint{display:block}
}
@keyframes sidein{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.kbd-hint{display:none;margin-top:14px;font-size:12px;color:var(--muted)}
.kbd-hint b{font-weight:900;color:var(--ink)}

.view-body{white-space:pre-wrap;font-size:16px;font-weight:600;line-height:1.5;margin-top:10px}
.opt{display:flex;align-items:center;width:100%;min-height:52px;padding:0 14px;border-radius:14px;background:var(--surface);font-weight:800;margin-top:8px;text-align:left}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.acc{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;padding:10px 12px;margin-top:8px}
.acc .em{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:14px}
.mini{height:36px;padding:0 12px;border-radius:11px;background:var(--sunk);font-size:13px;font-weight:800}
.mini.yes{background:var(--sensei-f);color:var(--sensei-i)}

/* sign-in and no-access */
.auth{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:calc(90px + env(safe-area-inset-top)) 28px 40px;gap:16px;text-align:center}
.auth svg.m{width:132px;height:132px}
.auth h1{margin:0;font-size:27px;font-weight:900}
.auth p{margin:0;font-size:15px;font-weight:600;color:var(--muted);line-height:1.45}
.auth .note{max-width:360px;display:flex;gap:10px;text-align:left;background:var(--kata-f);color:var(--kata-i);border-radius:16px;padding:12px 14px;font-size:14px;font-weight:700;box-shadow:none}
.auth .note svg{width:20px;height:20px;flex-shrink:0}
#gbtn{min-height:44px;display:flex;justify-content:center;width:100%;max-width:340px}

.toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 96px + env(safe-area-inset-bottom));width:calc(100% - 36px);max-width:520px;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:700;box-shadow:var(--shadow)}
.toast[hidden]{display:none}
.toast .grow{font-size:14px}
.toast button{color:var(--bg);font-weight:900;text-decoration:underline;min-height:36px;padding:0 6px}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheetWrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
(function(){
"use strict";

/* =====================================================================
   CONFIG. Filled in after deploying (see SETUP.md). A link like
   …/#api=<web app url>&client=<client id> also sets them on one phone.
   ===================================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycbx0UcyEU5g-BdHWa9DfxAKFNYdbsZjDaGCLehJsaAWMk9ug1zVMlhDjFOGZdwQm4OdT/exec";
const CLIENT_ID = "506844080576-q8tj69t28ht96meivgu35c7k89p5gl8k.apps.googleusercontent.com";
const KATA_SITE = "https://dailuo-source.github.io/SKA-Kata-Tracker/";

const TYPES=[{k:"Kata",c:"kata",s:"Kata"},{k:"Kihon",c:"kihon",s:"Kihon"},{k:"Kumite",c:"kumite",s:"Kumite"},
  {k:"Sensei says",c:"sensei",s:"Sensei says"},{k:"General",c:"general",s:"General"}];
/* Goals are a flag on any note (n.goal), not a type. Old "Goals" notes read as General + goal. */
const FROM=[{k:"Me",s:"My own note"},{k:"Sensei",s:"Sensei"},{k:"Seminar",s:"Seminar"}];
const STATUSES=["Learning","Polishing","Solid"];
/* Follow up (Gary, Oct 21): a question to ask or a thing to check. Assignments only ever come from Sensei. */
const ASKS=[{k:"Sensei",s:"Ask Sensei"},{k:"Senpai",s:"Ask Senpai"},{k:"Myself",s:"Check myself"}];
const askLbl=k=>(ASKS.find(a=>eqi(a.k,k))||ASKS[0]).s;
const WORK_MAX=3;

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eqi=(a,b)=>String(a==null?"":a).trim().toLowerCase()===String(b==null?"":b).trim().toLowerCase();
const LS={get(k,d){try{const v=localStorage.getItem("kc."+k);return v==null?d:v;}catch(e){return d;}},
  set(k,v){try{localStorage.setItem("kc."+k,v);}catch(e){}},del(k){try{localStorage.removeItem("kc."+k);}catch(e){}}};
const typeOf=k=>TYPES.find(t=>eqi(t.k,k))||TYPES[TYPES.length-1];

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");
const dayKey=ms=>{const d=new Date(ms);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};
const todayKey=()=>dayKey(Date.now());
const keyDate=k=>{const p=k.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]||1,12);};
const shiftDay=(k,n)=>{const d=keyDate(k);d.setDate(d.getDate()+n);return dayKey(d.getTime());};
const fmtDay=(k,long)=>{const o={weekday:long?"long":"short",month:"short",day:"numeric"};if(k.slice(0,4)!==todayKey().slice(0,4))o.year="numeric";return keyDate(k).toLocaleDateString([],o);};
const relDay=k=>k===todayKey()?"Today · "+fmtDay(k):k===shiftDay(todayKey(),-1)?"Yesterday · "+fmtDay(k):fmtDay(k);
const fmtMonth=m=>keyDate(m+"-01").toLocaleDateString([],{month:"long",year:"numeric"});

/* ---------- kawaii icons ---------- */
const FACE=(y,gap)=>`<circle cx="${16-gap}" cy="${y}" r="1.4" fill="#1E2235"/><circle cx="${16+gap}" cy="${y}" r="1.4" fill="#1E2235"/><ellipse cx="${16-gap-2.2}" cy="${y+3}" rx="1.6" ry="1" fill="#F4A6B5"/><ellipse cx="${16+gap+2.2}" cy="${y+3}" rx="1.6" ry="1" fill="#F4A6B5"/><path d="M14.8 ${y+2.6} Q16 ${y+3.8} 17.2 ${y+2.6}" fill="none" stroke="#1E2235" stroke-width="1.2" stroke-linecap="round"/>`;
const ICONS={
  kata:`<rect x="7" y="6" width="18" height="20" rx="3" fill="#fff" stroke="currentColor" stroke-width="1.8"/><rect x="5" y="4" width="22" height="4" rx="2" fill="#7C89D9" stroke="currentColor" stroke-width="1.5"/><rect x="5" y="24" width="22" height="4" rx="2" fill="#7C89D9" stroke="currentColor" stroke-width="1.5"/>${FACE(15,3)}`,
  kihon:`<circle cx="16" cy="17" r="10" fill="#fff" stroke="currentColor" stroke-width="1.8"/><path d="M6.5 13.5h19" stroke="#1E2235" stroke-width="3"/><path d="M16 13.5l-3.5 6.5M16 13.5l3.5 6.5" stroke="#1E2235" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="10.5" r="1.3" fill="#1E2235"/><circle cx="20" cy="10.5" r="1.3" fill="#1E2235"/><ellipse cx="9.5" cy="18" rx="1.5" ry="1" fill="#F4A6B5"/><ellipse cx="22.5" cy="18" rx="1.5" ry="1" fill="#F4A6B5"/>`,
  kumite:`<path d="M9 12a7 7 0 0 1 14 0v8a5 5 0 0 1-5 5h-4a5 5 0 0 1-5-5z" fill="#fff" stroke="currentColor" stroke-width="1.8"/><path d="M9 15a3 3 0 0 0-3 3 3 3 0 0 0 3 3" fill="#fff" stroke="currentColor" stroke-width="1.8"/><rect x="10" y="24" width="12" height="4" rx="1.5" fill="#E86A86" stroke="currentColor" stroke-width="1.5"/>${FACE(15,2.6).replace(/cx="16"/g,'cx="16.5"')}`,
  sensei:`<path d="M6 7h20a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H15l-5 4v-4H6a3 3 0 0 1-3-3V10a3 3 0 0 1 3-3z" fill="#fff" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>${FACE(14,3)}`,
  goals:`<path d="M16 3.5l3.6 7.7 8.4.8-6.4 5.6 2 8.4L16 21.6 8.4 26l2-8.4L4 12l8.4-.8z" fill="#FFD66B" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>${FACE(14.5,2.6)}`,
  general:`<rect x="7" y="6" width="18" height="22" rx="3" fill="#fff" stroke="currentColor" stroke-width="1.8"/><path d="M11 4v5M16 4v5M21 4v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>${FACE(16,3)}`,
  work:`<path d="M16 3c1.5 4.5 9 8 9 15.5a9 9 0 0 1-18 0c0-4 2.2-6.6 4.5-8.5.2 2.8 1.2 4 2.4 4.3C13.6 9.5 13.5 6.3 16 3z" fill="#FF9A6B" stroke="#1E2235" stroke-width="1.6" stroke-linejoin="round"/>${FACE(19,3)}`,
  follow:`<path d="M16 4.5c1 0 1.8.8 1.8 1.8v.7A7.5 7.5 0 0 1 23.5 14.5v5l2.5 3.5H6l2.5-3.5v-5A7.5 7.5 0 0 1 14.2 7v-.7c0-1 .8-1.8 1.8-1.8z" fill="#7CC8FF" stroke="#1E2235" stroke-width="1.6" stroke-linejoin="round"/><circle cx="16" cy="26.3" r="2.3" fill="#FFD66B" stroke="#1E2235" stroke-width="1.4"/>${FACE(15.5,3)}`,
  assign:`<rect x="7" y="6" width="18" height="22" rx="3" fill="#fff" stroke="#1E2235" stroke-width="1.8"/><rect x="11.5" y="3.5" width="9" height="5" rx="1.6" fill="#C9A8FF" stroke="#1E2235" stroke-width="1.5"/>${FACE(14,3)}<path d="M12 22.5l2.2 2.2 5-5" fill="none" stroke="#8A5BD6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`
};
const icon=c=>`<svg viewBox="0 0 32 32" aria-hidden="true">${ICONS[c]||ICONS.general}</svg>`;
function mascot(mood){
  const eyes=mood==="stern"?`<path d="M17.8 23.5l3.4 1.8M30.2 23.5l-3.4 1.8" stroke="#1E2235" stroke-width="1.4" stroke-linecap="round"/><circle cx="19.5" cy="26" r="1.5" fill="#1E2235"/><circle cx="28.5" cy="26" r="1.5" fill="#1E2235"/>`
    :mood==="sleepy"?`<path d="M17.5 25q2 1.6 4 0M26.5 25q2 1.6 4 0" fill="none" stroke="#1E2235" stroke-width="1.3" stroke-linecap="round"/>`
    :`<circle cx="19.5" cy="25" r="1.8" fill="#1E2235"/><circle cx="28.5" cy="25" r="1.8" fill="#1E2235"/><circle cx="20.1" cy="24.4" r=".6" fill="#fff"/><circle cx="29.1" cy="24.4" r=".6" fill="#fff"/>`;
  const mouth=mood==="stern"?`<path d="M22.3 29h3.4" stroke="#1E2235" stroke-width="1.3" stroke-linecap="round"/>`:`<path d="M22.3 27.4q1.7 2.2 3.4 0" fill="none" stroke="#1E2235" stroke-width="1.3" stroke-linecap="round"/>`;
  return `<svg class="m" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 5c5 0 21 28 19 33s-36 5-38 0S19 5 24 5z" fill="#fff" stroke="#1E2235" stroke-width="1.6"/><path d="M13 17q11-4 22 0l1.5 3.5q-12.5-4-25 0z" style="fill:var(--head)"/><path d="M35 18l6-3-2 6z" style="fill:var(--head)"/><rect x="17" y="31" width="14" height="10" rx="2" fill="#1E2235"/>${eyes}<ellipse cx="15.5" cy="28.3" rx="2.4" ry="1.4" fill="#F4A6B5"/><ellipse cx="32.5" cy="28.3" rx="2.4" ry="1.4" fill="#F4A6B5"/>${mouth}</svg>`;
}
const KIAI=`<svg viewBox="0 0 34 34" aria-hidden="true"><path d="M17 2l3 8 8-4-4 8 8 3-8 3 4 8-8-4-3 8-3-8-8 4 4-8-8-3 8-3-4-8 8 4z" fill="#FFD66B" stroke="#1E2235" stroke-width="1.4" stroke-linejoin="round"/><circle cx="14.5" cy="16" r="1.3" fill="#1E2235"/><circle cx="19.5" cy="16" r="1.3" fill="#1E2235"/><ellipse cx="17" cy="20" rx="2" ry="1.6" fill="#1E2235"/></svg>`;
const SVG=(d,w)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||2.2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I={
  search:SVG('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>'),
  plus:SVG('<path d="M12 5v14M5 12h14"/>',2.8),
  back:SVG('<path d="M15 6l-6 6 6 6"/>',2.4),
  right:SVG('<path d="M9 6l6 6-6 6"/>',2.4),
  down:SVG('<path d="M6 9l6 6 6-6"/>',2.6),
  cal:SVG('<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>'),
  sort:SVG('<path d="M7 4v16M3 16l4 4 4-4M14 6h7M14 11h5M14 16h3"/>'),
  notes:SVG('<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/>'),
  kata:SVG('<rect x="5" y="5" width="14" height="15" rx="2"/><path d="M3 4h18M3 21h18"/>'),
  clip:SVG('<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9z"/><path d="M9 14l2 2 4-4"/>'),
  star:SVG('<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/>'),
  check:SVG('<path d="M5 12.5l4.5 4.5L19 7"/>',3),
  pin:SVG('<path d="M9 4h6l-1 6 4 3v2H6v-2l4-3z"/><path d="M12 15v6"/>'),
  ext:SVG('<path d="M7 17L17 7M9 7h8v8"/>',2.4),
  lock:SVG('<rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
  close:SVG('<path d="M6 6l12 12M18 6L6 18"/>',2.4),
  video:SVG('<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/>')
};

/* ---------- state ---------- */
let API=LS.get("api","")||API_URL, CLIENT=LS.get("client","")||CLIENT_ID;
let SESSION=LS.get("session",""), ROLE=LS.get("role",""), EMAIL=LS.get("email",""), THEME=LS.get("theme","dark");
let S={notes:[],assignments:[],kata:[],access:[],kataList:[]};
let auth="signin", ready=false, noAccess={email:"",requested:false}, setupMsg="";
let queue=[],inflight=false,flushT=0,retryT=0,lastSync=0,syncState="",sheetUrl=LS.get("sheet","");
let kataSort=LS.get("ksort","adv")==="beg"?"beg":"adv"; // adv = most advanced belt first (Gary, Oct 20)
let tab=LS.get("tab","notes"), typeF="All", q="", dateF="all", sortNew=LS.get("sort","new")!=="old";

function readLinkParams(){
  try{
    const h=new URLSearchParams((location.hash||"").replace(/^#/,""));
    const api=h.get("api"),cid=h.get("client");
    if(api&&/^https:\/\/script\.google\.com\//.test(api)){API=api;LS.set("api",api);}
    if(cid&&/\.apps\.googleusercontent\.com$/.test(cid)){CLIENT=cid;LS.set("client",cid);}
    const k=new URLSearchParams(location.search).get("kata");
    if(k){tab="kata";kataOpen=k;}
    if(api||cid||k)history.replaceState(null,"",location.pathname);
  }catch(e){}
}

function normalize(st){
  st=st||{};const str=v=>String(v==null?"":v).trim();
  return{
    notes:(st.notes||[]).map(r=>Object.assign({},r,{type:typeOf(r.type).k,date:+r.date||+r.added||Date.now(),added:+r.added||0,
      title:str(r.title),note:String(r.note==null?"":r.note),kata:str(r.kata),from:FROM.find(f=>eqi(f.k,r.from))?FROM.find(f=>eqi(f.k,r.from)).k:"Me",
      video:str(r.video),pinned:!!r.pinned,goal:!!r.goal||eqi(r.type,"Goals"),done:!!r.done,
      followUp:!!r.followUp,ask:(ASKS.find(a=>eqi(a.k,r.ask))||ASKS[0]).k,answered:!!r.answered})),
    assignments:(st.assignments||[]).map(r=>Object.assign({},r,{title:str(r.title),kata:str(r.kata),given:+r.given||0,due:+r.due||0,
      steps:String(r.steps==null?"":r.steps),note:String(r.note==null?"":r.note),noteId:str(r.noteId),done:!!r.done,doneOn:+r.doneOn||0,added:+r.added||0})),
    kata:(st.kata||[]).map(r=>Object.assign({},r,{kata:str(r.kata),status:STATUSES.find(s=>eqi(s,r.status))||"",kiais:r.kiais==null||r.kiais===""?null:+r.kiais,reminders:String(r.reminders==null?"":r.reminders),kiaiNotes:String(r.kiaiNotes==null?"":r.kiaiNotes)})),
    access:(st.access||[]).map(r=>Object.assign({},r,{email:str(r.email),status:str(r.status)||"Requested"})),
    kataList:Array.isArray(st.kataList)?st.kataList:[]
  };
}
function saveCache(){try{LS.set("state",JSON.stringify(S));LS.set("role",ROLE);LS.set("email",EMAIL);}catch(e){}}
function loadCache(){try{const s=LS.get("state","");if(s){S=normalize(JSON.parse(s));return true;}}catch(e){}return false;}

/* ---------- sync with the sheet ---------- */
function callApi(payload){return fetch(API,{method:"POST",body:JSON.stringify(payload),redirect:"follow"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();});}
const uid=()=>("x"+Date.now().toString(36)+Math.random().toString(36).slice(2,9));
function applyLocal(o){const arr=S[o.coll];if(!arr)return;
  if(o.op==="add"){const rec=Object.assign({id:o.id},o.data);const i=arr.findIndex(d=>d.id===o.id);if(i>=0)arr[i]=rec;else arr.push(rec);}
  else if(o.op==="update"){const x=arr.find(d=>d.id===o.id);if(x)Object.assign(x,o.data);}
  else S[o.coll]=arr.filter(d=>d.id!==o.id);}
function enqueue(o){if(ROLE!=="owner"){toast("You can look, but only the owner can change notes.");return;}
  queue.push(o);applyLocal(o);saveCache();onData();clearTimeout(flushT);flushT=setTimeout(flush,350);}
const store={
  add(c,data){const id=uid();enqueue({op:"add",coll:c,id,data});return id;},
  update(c,id,data){enqueue({op:"update",coll:c,id,data});},
  del(c,id){enqueue({op:"del",coll:c,id});}
};
async function flush(){
  if(auth!=="ok"||!SESSION||!API)return;
  if(inflight){clearTimeout(flushT);flushT=setTimeout(flush,400);return;}
  clearTimeout(retryT);
  const ops=queue.slice();inflight=true;setSync(ops.length?"saving":ready?"loading":"connecting");
  let res;
  try{res=await callApi({session:SESSION,ops});}catch(e){res={ok:false,error:"network"};}
  inflight=false;
  handle(res,ops.length);
}
function handle(res,n){
  if(res&&res.ok){
    queue=queue.slice(n);
    if(res.session){SESSION=res.session;LS.set("session",SESSION);}
    ROLE=res.role;EMAIL=res.email||EMAIL;
    if(res.sheetUrl){sheetUrl=res.sheetUrl;LS.set("sheet",sheetUrl);}
    S=normalize(res.state);queue.forEach(applyLocal);saveCache();
    const was=auth;auth="ok";const first=!ready;ready=true;lastSync=Date.now();setSync("ok");
    if(first||was!=="ok")render();else onData();
    if(queue.length){clearTimeout(flushT);flushT=setTimeout(flush,350);}
    return;
  }
  const err=res&&res.error;
  if(err==="signed_out"){signOut(res.message);return;}
  if(err==="no_access"){
    if(res.session){SESSION=res.session;LS.set("session",SESSION);}
    noAccess={email:res.email||"",requested:!!res.requested};wipeLocal();auth="noaccess";closeSheet();render();return;}
  if(err==="not_setup"){auth="setup";setupMsg=res.message||"";render();return;}
  if(err==="read_only"){queue=[];toast(res.message);setTimeout(flush,100);return;}
  setSync("error");
  if(auth!=="ok"){toast(res&&res.message&&err!=="network"?res.message:"Can't reach your notes right now. Check your connection and try again.");render();return;}
  if(res&&res.message&&err!=="network")toast(res.message);
  else toast(n?"Can't reach your sheet. Your notes will save when you're back online.":"Can't reach your sheet. Tap the status to retry.");
  retryT=setTimeout(flush,15000);
}
function setSync(s){syncState=s;const el=$("#sync");if(!el)return;
  const t={connecting:"Connecting…",loading:"Refreshing…",saving:"Saving…",ok:"Synced "+new Date(lastSync).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}),error:"Offline · tap to retry"}[s]||"";
  el.textContent=ROLE==="viewer"?"View only · "+t:t;el.classList.toggle("bad",s==="error");}
document.addEventListener("visibilitychange",()=>{if(document.hidden||auth!=="ok")return;if(Date.now()-lastSync>15000)flush();});
setInterval(()=>{if(!document.hidden&&auth==="ok"&&!queue.length&&!inflight&&Date.now()-lastSync>60000)flush();},20000);
window.addEventListener("beforeunload",e=>{if(queue.length){e.preventDefault();e.returnValue="";}});

/* ---------- Google sign-in ---------- */
let gisReady=false,signingIn=false;
function loadGis(){
  if(gisReady||!CLIENT)return;
  if(window.google&&google.accounts&&google.accounts.id){initGis();return;}
  if(document.getElementById("gsi"))return;
  const s=document.createElement("script");s.id="gsi";s.src="https://accounts.google.com/gsi/client";s.async=true;s.onload=initGis;
  s.onerror=()=>{const el=$("#gbtn");if(el)el.innerHTML='<p>Couldn\'t load Google sign-in. Check your connection.</p>';};
  document.head.appendChild(s);
}
function initGis(){
  if(gisReady||!window.google||!google.accounts)return;
  google.accounts.id.initialize({client_id:CLIENT,callback:r=>signIn(r.credential),auto_select:true,use_fedcm_for_prompt:true,itp_support:true,cancel_on_tap_outside:false});
  gisReady=true;drawGis();
}
function drawGis(){
  const el=$("#gbtn");if(!el||!gisReady)return;el.innerHTML="";
  google.accounts.id.renderButton(el,{theme:THEME==="dark"?"filled_black":"outline",size:"large",shape:"pill",text:"continue_with",logo_alignment:"left",width:Math.min(320,el.clientWidth||320)});
  if(auth==="signin"&&!LS.get("signedOut",""))try{google.accounts.id.prompt();}catch(e){}
}
async function signIn(tok){
  if(!tok||signingIn)return;signingIn=true;LS.del("signedOut");
  const el=$("#gbtn");if(el)el.insertAdjacentHTML("afterend",'<p id="signing">Signing you in…</p>');
  let res;try{res=await callApi({idToken:tok});}catch(e){res={ok:false,error:"network"};}
  signingIn=false;const sg=$("#signing");if(sg)sg.remove();
  handle(res,0);
}
function wipeLocal(){queue=[];S={notes:[],assignments:[],kata:[],access:[],kataList:[]};ready=false;["state","role","email","sheet"].forEach(LS.del);ROLE="";}
function signOut(msg){
  SESSION="";LS.del("session");wipeLocal();EMAIL="";auth="signin";LS.set("signedOut","1");closeSheet();
  try{if(window.google&&google.accounts)google.accounts.id.disableAutoSelect();}catch(e){}
  render();if(msg)toast(msg);
}

/* ---------- helpers on the data ---------- */
const kataInfo=name=>S.kata.find(r=>eqi(r.kata,name));
function upsertKata(name,data){const r=kataInfo(name);if(r)store.update("kata",r.id,data);else store.add("kata",Object.assign({kata:name},data));}
function kataNames(){
  const out=[],seen={};
  const push=(name,en,order,cat,belt)=>{const k=name.toLowerCase();if(!name||seen[k])return;seen[k]=1;out.push({name,en:en||"",order:order==null?999:order,cat:cat||"",belt:belt||""});};
  S.kataList.forEach(k=>push(String(k.name||"").trim(),k.en,k.order,k.cat,k.belt));
  S.kata.forEach(k=>push(k.kata));S.notes.forEach(n=>push(n.kata));
  return out;
}
const kataEn=name=>{const k=S.kataList.find(x=>eqi(x.name,name));return k?k.en:"";};
const noteTitle=n=>n.title||(n.kata&&n.type==="Kata"?n.kata:"")||String(n.note||"").split("\n")[0].slice(0,60)||"Untitled note";
const workCount=except=>S.notes.filter(n=>n.pinned&&!(n.goal&&n.done)&&n.id!==except).length;
const MK={goal:'<span class="mk mk-goal">★ Goal</span>',work:'<span class="mk mk-work">Working on</span>',fu:'<span class="mk mk-fu">Follow up</span>'};
const marks=n=>(n.goal?MK.goal:"")+(n.pinned&&!(n.goal&&n.done)?MK.work:"")+(n.followUp&&!n.answered?MK.fu:"");
/* assignments: steps are one per line, "[x] " in front = done */
function parseSteps(txt){return String(txt||"").split("\n").filter(l=>l.trim()).map(l=>{const m=/^\s*\[( |x|X)?\]\s*/.exec(l);
  return{done:!!(m&&/x/i.test(m[1]||"")),text:(m?l.slice(m[0].length):l).trim()};}).filter(x=>x.text);}
const serSteps=st=>st.map(x=>(x.done?"[x] ":"[ ] ")+x.text).join("\n");
const daysTo=ms=>Math.round((keyDate(dayKey(ms))-keyDate(todayKey()))/864e5);
const shortDate=ms=>keyDate(dayKey(ms)).toLocaleDateString([],{month:"short",day:"numeric"});
const isLate=a=>!a.done&&!!a.due&&daysTo(a.due)<0;
function dueLabel(a){if(!a.due)return "No due date";const d=daysTo(a.due);
  if(d<-1)return "Was due "+shortDate(a.due);if(d===-1)return "Was due yesterday";if(d===0)return "Due today";if(d===1)return "Due tomorrow";
  if(d<7)return "Due "+keyDate(dayKey(a.due)).toLocaleDateString([],{weekday:"short"});return "Due "+shortDate(a.due);}
function relDue(a){const d=daysTo(a.due);return d===0?"today":d===1?"tomorrow":d>1?"in "+d+" days":d===-1?"1 day late":(-d)+" days late";}
const byDate=(a,b)=>(a.date-b.date)||((a.added||0)-(b.added||0));
const DATE_OPTS=[["all","All dates"],["week","Last 7 days"],["month","This month"],["3m","Last 3 months"]];
const dateLabel=()=>{const o=DATE_OPTS.find(x=>x[0]===dateF);return o?o[1]:fmtMonth(dateF);};
function inDate(n){const k=dayKey(n.date),t=todayKey();
  if(dateF==="all")return true;if(dateF==="week")return k>=shiftDay(t,-6)&&k<=t;
  if(dateF==="month")return k.slice(0,7)===t.slice(0,7);if(dateF==="3m")return k>=shiftDay(t,-89);
  return k.slice(0,7)===dateF;}
function filtered(){
  const qq=q.trim().toLowerCase();
  return S.notes.filter(n=>(typeF==="All"||n.type===typeF)&&inDate(n)&&(!qq||[n.title,n.note,n.kata,n.type,n.from].join(" ").toLowerCase().includes(qq)))
    .sort((a,b)=>sortNew?byDate(b,a):byDate(a,b));
}

/* ---------- screens ---------- */
function applyTheme(){document.documentElement.dataset.theme=THEME;const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=THEME==="dark"?"#131528":"#F2F3F7";}
function render(){
  applyTheme();
  const app=$("#app");
  if(auth==="setup"){app.innerHTML=authScreen("sleepy","Almost ready","Karate-Ka Companion isn't connected to its sheet yet."+(setupMsg?" "+esc(setupMsg):""),"");return;}
  if(auth==="signin"){app.innerHTML=authScreen("happy","Karate-Ka Companion","Your private karate notebook",
    `<div class="grow"></div><div id="gbtn">${CLIENT&&API?"":'<p>Sign-in isn\'t set up on this phone yet.</p>'}</div>
     <div class="note">${I.lock}<span>Only the owner's Google account can open these notes. Anyone else has to ask the owner for permission.</span></div>`);
    if(CLIENT&&API){loadGis();drawGis();}return;}
  if(auth==="noaccess"){app.innerHTML=authScreen("stern","These notes are private",
    `You're signed in as <strong style="color:var(--ink)">${esc(noAccess.email)}</strong>, which doesn't have permission to open this companion.`,
    `<div class="grow"></div>${noAccess.requested
      ?'<div class="note">'+I.check+'<span>Request sent. The owner gets an email and decides. Nothing is shown until they say yes.</span></div><button class="btn primary wide" data-act="recheck">Check again</button>'
      :'<button class="btn primary wide" data-act="ask">Ask the owner for access</button>'}
     <button class="btn wide" data-act="other-account">Use a different account</button>`);return;}
  if(!ready){app.innerHTML=authScreen("sleepy","Opening your notes…","","");return;}
  let html="";
  if(tab==="kata"&&kataOpen&&!wide())html=kataPage(kataOpen);
  else html=header()+(tab==="kata"?viewKataList():tab==="goals"?viewGoals():tab==="assignments"?viewAssignments():viewNotes());
  app.innerHTML=html+nav()+(ROLE==="owner"&&!(tab==="kata"&&!kataOpen)?`<button class="fab ${tab==="assignments"?"fab-as":""}" data-act="new" aria-label="${tab==="assignments"?"New assignment":"New note"}">${I.plus}</button>`:"");
  setSync(syncState||"ok");
  replayTap();
  if(wide()&&tab==="kata"&&kataOpen&&!sheet)openSheet({type:"kata",name:kataOpen});
  markActive();
  if(wide()&&!sheet){const b=$("#sheet");if(b&&!b.querySelector(".pane-empty"))b.innerHTML=paneEmpty();}
}

/* Big screens (Gary, Oct 20): the panel is a docked column on the right, not a dark overlay.
   The list stays clickable and a new note replaces the open one. */
const WIDE=matchMedia("(min-width:1000px)");const wide=()=>WIDE.matches;
const paneEmpty=()=>`<div class="pane-empty">${mascot("sleepy")}<p>Pick a note to read it here.</p></div>`;
function markActive(){const cur=sheet&&(sheet.type==="note"||sheet.type==="form")?sheet.id:null;
  document.querySelectorAll("#app [data-act=open-note]").forEach(el=>el.classList.toggle("active",!!cur&&el.dataset.id===cur));
  const ca=sheet&&(sheet.type==="assign"||sheet.type==="aform")?sheet.id:null;
  document.querySelectorAll("#app [data-act=open-assign]").forEach(el=>el.classList.toggle("active",!!ca&&el.dataset.id===ca));
  const kc=sheet&&sheet.type==="kata"?sheet.name:sheet&&sheet.back?sheet.back.name:null;
  document.querySelectorAll("#app [data-act=open-kata]").forEach(el=>el.classList.toggle("active",!!kc&&eqi(el.dataset.v,kc)));}
const curKata=()=>sheet&&sheet.type==="kata"?sheet.name:sheet&&sheet.back&&sheet.back.type==="kata"&&(sheet.type==="rem"||sheet.type==="kiai")?sheet.back.name:kataOpen;
function noteCard(n){
  const t=typeOf(n.type),title=noteTitle(n);
  const meta=[`<b>${esc(t.s)}</b>`,n.kata&&title!==n.kata?esc(n.kata):"",n.from!=="Me"?esc(n.from):""].filter(Boolean).join(" · ");
  const snip=n.title||n.type!=="Kata"||!n.kata?String(n.note||"").replace(/\s+/g," "):String(n.note||"").replace(/\s+/g," ");
  return `<button class="note t-${t.c}" data-act="open-note" data-id="${esc(n.id)}"><span class="ico">${icon(t.c)}</span>
    <span class="nbody"><span class="meta">${meta}${marks(n)}</span><span class="ntitle">${esc(title)}</span>${snip&&snip!==title?`<span class="nsnip">${esc(snip)}</span>`:""}</span></button>`;
}
function viewNotes(){
  const pinned=S.notes.filter(n=>n.pinned&&!(n.goal&&n.done)).sort((a,b)=>byDate(b,a));
  const heroes=pinned.length?`<h2 class="sec sec-work">${icon("work")}Working on · ${pinned.length<=WORK_MAX?pinned.length+" of "+WORK_MAX:pinned.length}</h2>
    <div class="heroes">${pinned.map(n=>`<button class="hero" data-act="open-note" data-id="${esc(n.id)}">
      <svg class="star" viewBox="0 0 32 32" aria-hidden="true">${ICONS.work}</svg>
      <span class="grow" style="min-width:0"><span class="lbl" style="display:block">${esc(n.kata&&noteTitle(n)!==n.kata?n.kata:typeOf(n.type).s)}</span><span class="big">${esc(noteTitle(n))}</span></span>
      <span class="go">${I.right}</span></button>`).join("")}</div>`:"";
  const fus=S.notes.filter(n=>n.followUp&&!n.answered).sort((a,b)=>byDate(a,b));
  const follow=fus.length?`<h2 class="sec sec-fu">${icon("follow")}Follow up · ${fus.length}</h2>
    <div class="fus">${fus.map(n=>`<div class="fu"><button class="fubody" data-act="open-note" data-id="${esc(n.id)}"><span class="who">${esc(askLbl(n.ask))}</span><span class="big">${esc(noteTitle(n))}</span></button>
      ${ROLE==="owner"?`<button class="tick" data-act="answer" data-id="${esc(n.id)}" aria-label="Mark answered: ${esc(noteTitle(n))}">${I.check}</button>`:""}</div>`).join("")}</div>`:"";
  const chips=[{k:"All",c:""}].concat(TYPES).map(t=>`<button class="chip ${t.c?"t-"+t.c:""}" data-act="type" data-v="${esc(t.k)}" aria-pressed="${typeF===t.k}">${esc(t.s||t.k)}</button>`).join("");
  return `<div class="search">${I.search}<label for="q" class="sr">Search notes</label><input id="q" type="search" placeholder="Search notes, kata, sensei…" value="${esc(q)}" autocomplete="off"></div>
    <div class="chips typechips" role="group" aria-label="Note type">${chips}</div>
    ${heroes}${follow}
    <div class="row pad" style="margin-top:16px"><button class="sbtn" data-act="datef">${I.cal}${esc(dateLabel())}<span style="width:14px;height:14px;display:inline-flex">${I.down}</span></button>
      <span class="grow"></span><button class="sbtn" data-act="sort" aria-label="Sort order: ${sortNew?"newest first":"oldest first"}">${I.sort}${sortNew?"Newest first":"Oldest first"}</button></div>
    <div id="list">${notesList()}</div>`;
}
function notesList(){
  const list=filtered();
  if(!S.notes.length)return `<div class="empty">${mascot("happy")}No notes yet.${ROLE==="owner"?"<br>Tap + to write your first one.":""}</div>`;
  if(!list.length)return `<div class="empty">${mascot("sleepy")}No notes match.</div>`;
  let last="",out="";
  list.forEach(n=>{const k=dayKey(n.date);if(k!==last){out+=`<h2 class="dhead">${esc(relDay(k))}</h2>`;last=k;}out+=noteCard(n);});
  return `<div class="list">${out}</div>`;
}
function viewGoals(){

function kataRows(){
  const qq=kq.trim().toLowerCase();
  const all=kataNames().filter(k=>!qq||(k.name+" "+k.en).toLowerCase().includes(qq));
  if(!all.length)return `<div class="empty">${mascot("sleepy")}${kataNames().length?"No kata match.":"The dojo's kata list will show up after the next sync."}</div>`;
  const counts={};S.notes.forEach(n=>{if(n.kata){const k=n.kata.toLowerCase();counts[k]=(counts[k]||0)+1;}});
  const row=k=>{const info=kataInfo(k.name),c=counts[k.name.toLowerCase()]||0;
    return `<button class="krow" data-act="open-kata" data-v="${esc(k.name)}"><span class="knum">${k.order<999?esc(k.order):""}</span>
      <span class="grow" style="min-width:0"><span class="kname">${esc(k.name)}</span>${k.en?`<span class="ken">${esc(k.en)}</span>`:""}</span>
      <span class="badges">${info&&info.status?`<span class="badge s-${info.status}">${esc(info.status)}</span>`:""}
      <span class="badge">${c} note${c===1?"":"s"}${info&&info.kiais!=null?" · "+info.kiais+" kiai"+(info.kiais===1?"":"s"):""}</span></span></button>`;};
  // Group: Solo, then Multi-person, then Weapon (from the dojo Kata Tracker), each by belt rank.
  const catOf=k=>{const i=KCATS.findIndex(c=>eqi(c,k.cat));return i<0?(k.order<999?KCATS.length:KCATS.length+1):i;};
  const beltOf=k=>{const i=BELTS.findIndex(b=>eqi(b,k.belt));return i<0?BELTS.length:i;};
  const NB=BELTS.length,bo=(a,b)=>{const x=beltOf(a),y=beltOf(b);if(x===y)return 0;if(x===NB)return 1;if(y===NB)return -1;return kataSort==="adv"?y-x:x-y;};
  all.sort((a,b)=>catOf(a)-catOf(b)||bo(a,b)||a.order-b.order||a.name.localeCompare(b.name));
  let out="",lastC=-1,lastB=-1;
  all.forEach(k=>{const c=catOf(k),b=beltOf(k);

    out+=row(k);});

}

  const a=S.assignments.find(x=>x.id===id);if(!a)return shead("Assignment")+'<p class="sub">This assignment was removed.</p>';
  const can=ROLE==="owner",st=parseSteps(a.steps),dn=st.filter(x=>x.done).length,late=isLate(a),src=a.noteId?S.notes.find(n=>n.id===a.noteId):null;
  return shead("Assignment")+`<div class="atitle"><span class="ico big as-ico">${icon("assign")}</span><h3>${esc(a.title)}</h3></div>
    <div class="afacts"><div class="fact"><small>Given</small><b>${a.given?esc(fmtDay(dayKey(a.given))):"Not set"}</b></div>
      <div class="fact ${a.done?"":late?"late":a.due?"due":""}"><small>${a.done?"Done":"Due"}</small><b>${a.done?(a.doneOn?esc(fmtDay(dayKey(a.doneOn))):"Yes"):a.due?esc(fmtDay(dayKey(a.due)))+" · "+esc(relDue(a)):"No due date"}</b></div>
      ${a.kata?`<button class="fact kata" data-act="open-kata" data-v="${esc(a.kata)}"><small>Kata</small><b>${esc(a.kata)} ›</b></button>`:""}</div>
    ${st.length?`<div class="steps"><h2 class="h2" style="margin:4px 0">Steps · ${dn} of ${st.length}</h2>${st.map((x,i)=>`<button class="stp" data-act="step" data-id="${esc(a.id)}" data-v="${i}" aria-pressed="${x.done}" ${can?"":"disabled"}><span class="bx">${x.done?I.check:""}</span><span class="tx">${esc(x.text)}</span></button>`).join("")}</div>`:""}
    ${a.note?`<div class="box" style="margin:12px 0 0"><h2>Notes</h2><div class="view-body" style="margin:0">${esc(a.note)}</div></div>`:""}
    ${src?`<button class="opt" data-act="open-note" data-id="${esc(src.id)}"><span class="grow">Linked note · ${esc(noteTitle(src))}</span><span style="width:18px;height:18px">${I.right}</span></button>`:""}
    ${can?`<div class="btns"><button class="btn ${a.done?"":"ok"}" data-act="as-done" data-id="${esc(a.id)}">${a.done?"Not done yet":I.check+"Mark as done"}</button></div>
      <div class="btns" style="margin-top:10px"><button class="btn" data-act="edit-assign" data-id="${esc(a.id)}">Edit</button>
      <button class="btn danger" data-act="del-assign" data-id="${esc(a.id)}" data-confirm="Tap again to delete">Delete</button></div>`:""}`;
}
function assignForm(f){
  const a=f.id?S.assignments.find(x=>x.id===f.id):null,src=!a&&f.fromNote?S.notes.find(n=>n.id===f.fromNote):null;
  const v=a||{title:src?noteTitle(src):"",kata:src?src.kata:(f.preKata||""),given:src?src.date:Date.now(),due:0,steps:"",note:"",noteId:src?src.id:""};
  const names=kataNames();if(v.kata&&!names.some(k=>eqi(k.name,v.kata)))names.push({name:v.kata});
  return `<form id="assignForm" novalidate>`+shead(a?"Edit assignment":"New assignment")+`
    ${src?`<p class="sub" style="margin:0">From your note on ${esc(fmtDay(dayKey(src.date)))}. It stays linked.</p>`:""}
    <label class="field"><span>What did Sensei ask for?</span><input class="inp" name="title" value="${esc(v.title)}" maxlength="140" placeholder="e.g. Film Heian Godan and send it in" ${a?"":"autofocus"}></label>
    <label class="field"><span>Kata (optional)</span><select class="inp" name="kata"><option value="">None</option>
      ${names.map(k=>`<option value="${esc(k.name)}" ${eqi(k.name,v.kata)?"selected":""}>${esc(k.name)}</option>`).join("")}</select></label>
    <div class="row" style="gap:10px;align-items:stretch"><label class="field grow"><span>Given</span><input class="inp" type="date" name="given" value="${v.given?dayKey(v.given):todayKey()}"></label>
      <label class="field grow"><span>Due</span><input class="inp" type="date" name="due" value="${v.due?dayKey(v.due):""}"></label></div>
    <label class="field"><span>Steps (one per line, optional)</span><textarea class="inp" name="steps" rows="4" style="min-height:96px" placeholder="Moves 1 to 4&#10;Moves 5 to 8">${esc(parseSteps(v.steps).map(x=>x.text).join("\n"))}</textarea></label>
    <label class="field"><span>Notes</span><textarea class="inp" name="note" rows="3" style="min-height:84px" placeholder="Anything Sensei said about it">${esc(v.note)}</textarea></label>
    <input type="hidden" name="noteId" value="${esc(v.noteId||"")}">
    <div class="savebar"><button type="button" class="btn" data-act="close">Cancel</button><button type="submit" class="btn save">${I.check}${a?"Save changes":"Save assignment"}</button></div>
    <p class="kbd-hint"><b>Ctrl+S</b> saves · <b>Esc</b> cancels</p></form>`;
}
function saveAssign(form){
  const fd=new FormData(form),s=k=>String(fd.get(k)||"").trim();
  const title=s("title");if(!title){toast("Give the assignment a name first.");return;}
  const old=sheet.id?S.assignments.find(x=>x.id===sheet.id):null,prev=parseSteps(old&&old.steps);
  const steps=String(fd.get("steps")||"").split("\n").map(x=>x.trim()).filter(Boolean).map(text=>{
    const i=prev.findIndex(p=>p.text===text),done=i>=0&&prev[i].done;if(i>=0)prev.splice(i,1);return{text,done};});
  const data={title,kata:s("kata"),given:s("given")?keyDate(s("given")).getTime():Date.now(),due:s("due")?keyDate(s("due")).getTime():0,
    steps:serSteps(steps),note:String(fd.get("note")||"").replace(/\s+$/,""),noteId:s("noteId")};
  if(old)store.update("assignments",old.id,data);else store.add("assignments",Object.assign({added:Date.now(),done:false},data));
  closeSheet();
  if(old||tab==="assignments")toast(old?"Changes saved":"Assignment saved");
  else toast("Assignment saved",{label:"View",fn:()=>{tab="assignments";asView="todo";LS.set("tab",tab);kataOpen=null;render();window.scrollTo(0,0);}});
}
function accountSheet(){
  const owner=ROLE==="owner";
  const acc=owner?S.access.slice().sort((a,b)=>(a.status==="Requested"?0:1)-(b.status==="Requested"?0:1)):[];
  return shead("Account")+`<div class="acc"><span class="avatar" style="width:36px;text-align:center">${esc((EMAIL||"?").charAt(0).toUpperCase())}</span><span class="em">${esc(EMAIL)}<br><span class="sub">${owner?"Owner · full access":"View only"}</span></span></div>
    <h2 class="h2" style="margin-top:18px">Look</h2><div class="seg" style="background:var(--surface)"><button data-act="theme" data-v="dark" aria-pressed="${THEME==="dark"}">Dark</button><button data-act="theme" data-v="light" aria-pressed="${THEME==="light"}">Light</button><span></span></div>
    ${owner?`<h2 class="h2" style="margin-top:18px">Access</h2>${acc.length?acc.map(a=>`<div class="acc"><span class="em">${esc(a.email)}<br><span class="sub">${esc(a.status)}</span></span>
      ${a.status!=="Approved"?`<button class="mini yes" data-act="access" data-id="${esc(a.id)}" data-v="Approved">Allow</button>`:""}
      ${a.status!=="Denied"?`<button class="mini" data-act="access" data-id="${esc(a.id)}" data-v="Denied">${a.status==="Approved"?"Remove":"Say no"}</button>`:""}</div>`).join("")
      :`<p class="sub" style="margin:0">Nobody else can see your notes. If someone asks, you'll get an email and they'll show up here.</p>`}`:""}
    <div class="btns col">${owner&&sheetUrl?`<a class="btn wide" href="${esc(sheetUrl)}" target="_blank" rel="noopener" style="text-decoration:none;color:var(--ink)">Open my Google Sheet</a>`:""}
      <button class="btn wide danger" data-act="signout">Sign out</button></div>`;
}

/* ---------- toast ---------- */
let tT=0,tAct=null;
function toast(msg,act){const el=$("#toast");tAct=act||null;el.innerHTML=`<span class="grow">${esc(msg)}</span>${act?`<button data-act="toast">${esc(act.label)}</button>`:""}`;el.hidden=false;clearTimeout(tT);tT=setTimeout(hideToast,act?6000:2800);}
function hideToast(){const el=$("#toast");if(el)el.hidden=true;tAct=null;}
function armed(btn){if(btn.dataset.armed==="1")return true;const orig=btn.innerHTML;btn.dataset.armed="1";btn.textContent=btn.dataset.confirm;setTimeout(()=>{if(btn.isConnected){btn.dataset.armed="";btn.innerHTML=orig;}},3200);return false;}

function onData(){if(auth!=="ok"||!ready)return;render();if(sheet&&sheet.type!=="form"&&sheet.type!=="aform"&&sheet.type!=="rem"&&sheet.type!=="kiai")renderSheet();}

/* ---------- taps ---------- */
document.addEventListener("click",e=>{
  if(e.target.id==="sheetWrap"&&!wide()){closeSheet();return;}
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  const a=b.dataset.act,id=b.dataset.id,v=b.dataset.v;
  switch(a){
    case"tab":tab=v;LS.set("tab",v);if(v!=="kata")kataOpen=null;render();window.scrollTo(0,0);break;
    case"type":typeF=v;render();break;
    case"navtype":typeF=v;tab="notes";kataOpen=null;kiaiOpen=false;LS.set("tab","notes");render();window.scrollTo(0,0);break;
    case"sort":sortNew=!sortNew;LS.set("sort",sortNew?"new":"old");render();break;
    case"datef":openSheet({type:"date"});break;
    case"setdate":dateF=v;closeSheet();render();break;
    case"account":openSheet({type:"account"});break;
    case"sync":flush();break;
    case"close":closeSheet();break;
    case"new":if(tab==="assignments")openSheet({type:"aform"});else openSheet({type:"form",preType:"",preGoal:tab==="goals",preKata:tab==="kata"&&kataOpen?kataOpen:""});break;
    case"asview":asView=v;LS.set("asview",v);render();break;
    case"open-assign":openSheet({type:"assign",id});break;
    case"edit-assign":openSheet({type:"aform",id});break;
    case"to-assign":openSheet({type:"aform",fromNote:id});break;
    case"as-done":{const x=S.assignments.find(y=>y.id===id);if(!x)break;const now=!x.done;
      store.update("assignments",id,{done:now,doneOn:now?Date.now():0});toast(now?"Assignment done. Nice work!":"Back on your to-do list");break;}
    case"step":{const x=S.assignments.find(y=>y.id===id);if(!x)break;const st=parseSteps(x.steps),i=+v;if(!st[i])break;
      st[i].done=!st[i].done;store.update("assignments",id,{steps:serSteps(st)});if(st.length&&st.every(y=>y.done)&&!x.done)toast("All steps done. Mark the assignment done?",{label:"Done",fn:()=>store.update("assignments",id,{done:true,doneOn:Date.now()})});break;}
    case"del-assign":{if(!armed(b))break;const x=S.assignments.find(y=>y.id===id);if(!x)break;const copy=Object.assign({},x);delete copy.id;
      store.del("assignments",id);closeSheet();toast("Assignment deleted",{label:"Undo",fn:()=>enqueue({op:"add",coll:"assignments",id,data:copy})});break;}
    case"answer":{const n=S.notes.find(x=>x.id===id);if(!n)break;store.update("notes",id,{followUp:true,answered:!n.answered});toast(n.answered?"Answered. Off your Follow up list":"Back on Follow up");break;}
    case"new-kata-note":openSheet({type:"form",preType:"Kata",preKata:curKata()});break;
    case"open-note":openSheet({type:"note",id});break;
    case"edit-note":openSheet({type:"form",id});break;
    case"pin":{const n=S.notes.find(x=>x.id===id);if(!n)break;if(!n.pinned&&workCount(id)>=WORK_MAX){toast("Working on holds "+WORK_MAX+". Take one off first.");break;}
      store.update("notes",id,{pinned:!n.pinned});toast(n.pinned?"Added to Working on":"Taken off Working on");break;}
    case"del-note":{if(!armed(b))break;const n=S.notes.find(x=>x.id===id);if(!n)break;const copy=Object.assign({},n);delete copy.id;
      store.del("notes",id);closeSheet();toast("Note deleted",{label:"Undo",fn:()=>enqueue({op:"add",coll:"notes",id,data:copy})});break;}
    case"goal-done":{const n=S.notes.find(x=>x.id===id);if(n)store.update("notes",id,{done:!n.done});if(n&&n.done)toast("Goal done. Nice work!");break;}
    case"open-kata":{if(wide()&&sheet&&sheet.dirty){toast("Save or cancel your changes first.");break;}
      if(!eqi(v,kataOpen))kiaiOpen=false;const wasKata=tab==="kata";tab="kata";LS.set("tab","kata");kataOpen=v;
      if(wide()){if(sheet)sheet.back=null;openSheet({type:"kata",name:v});render();if(!wasKata)window.scrollTo(0,0);}
      else{closeSheet();kataOpen=v;render();window.scrollTo(0,0);}break;}
    case"kata-back":kataOpen=null;kiaiOpen=false;render();break;
    case"kstatus":{const nm=curKata();const info=kataInfo(nm);upsertKata(nm,{status:info&&info.status===v?"":v});break;}
    case"kiai":{const nm=curKata();const info=kataInfo(nm);const cur=info&&info.kiais!=null?info.kiais:0;upsertKata(nm,{kiais:Math.max(0,cur+Number(v))});break;}
    case"edit-rem":openSheet({type:"rem",name:curKata()});break;
    case"kiai-toggle":kiaiOpen=!kiaiOpen;render();if(sheet&&sheet.type==="kata")renderSheet();break;
    case"ksort":kataSort=kataSort==="adv"?"beg":"adv";LS.set("ksort",kataSort);render();break;
    case"edit-kiai":openSheet({type:"kiai",name:curKata()});break;
    case"theme":THEME=v;LS.set("theme",v);applyTheme();render();renderSheet();break;
    case"access":store.update("access",id,{status:v});break;
    case"signout":signOut();break;
    case"ask":(async()=>{b.disabled=true;let res;try{res=await callApi({session:SESSION,requestAccess:true});}catch(e2){res={ok:false,error:"network"};}handle(res,0);})();break;
    case"recheck":(async()=>{b.disabled=true;let res;try{res=await callApi({session:SESSION});}catch(e2){res={ok:false,error:"network"};}handle(res,0);if(auth==="noaccess")toast("Not yet. You'll get in once the owner says yes.");})();break;
    case"other-account":signOut();LS.del("signedOut");break;
    case"toast":{const f=tAct&&tAct.fn;hideToast();if(f)f();break;}
  }
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="noteForm")saveNote(e.target);
  if(e.target.id==="assignForm")saveAssign(e.target);
  if(e.target.id==="kiaiForm"){
    const fd=new FormData(e.target),info=kataInfo(sheet.name)||{},n=info.kiais||0,old=kiaiNotes(info);
    const out=old.slice();for(let i=0;i<n;i++)out[i]=String(fd.get("k"+i)||"").replace(/\s+/g," ").trim();
    while(out.length&&!out[out.length-1].trim())out.pop();
    upsertKata(sheet.name,{kiaiNotes:out.join("\n")});closeSheet();toast("Kiai notes saved");}
  if(e.target.id==="remForm"){const txt=String(new FormData(e.target).get("rem")||"").split("\n").map(s=>s.trim()).filter(Boolean).join("\n");upsertKata(sheet.name,{reminders:txt});closeSheet();}
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){q=e.target.value;$("#list").innerHTML=notesList();}
  if(e.target.id==="kq"){kq=e.target.value;$("#klist").innerHTML=kataRows();}
});
document.addEventListener("change",e=>{if(e.target.id==="pickMonth"&&e.target.value){dateF=e.target.value;closeSheet();render();}});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&sheet){closeSheet();return;}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){const f=$("#noteForm")||$("#assignForm");if(f){e.preventDefault();f.requestSubmit();}return;}
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||"")||(e.target&&e.target.isContentEditable);
  if(typing||sheet||e.ctrlKey||e.metaKey||e.altKey||auth!=="ok"||!ready)return;
  if(e.key==="/"){const s=$("#q")||$("#kq");if(s){e.preventDefault();s.focus();}}
  else if(e.key==="n"&&ROLE==="owner"&&tab==="assignments"){e.preventDefault();openSheet({type:"aform"});}
  else if(e.key==="n"&&ROLE==="owner"&&!(tab==="kata"&&!kataOpen)){e.preventDefault();openSheet({type:"form",preType:tab==="kata"&&kataOpen?"Kata":"",preGoal:tab==="goals",preKata:tab==="kata"&&kataOpen?kataOpen:""});}
});
/* Phone back button: keep one guard entry in history so Back steps out of the app's own screens
   (panel → kata page → Notes tab) instead of closing the app. On the Notes tab, Back asks once more. */
let exitArmed=false,exitT;
const guardBack=()=>{try{history.pushState({kc:1},"");}catch(e){}};
WIDE.addEventListener("change",()=>{if(!wide()&&sheet&&sheet.type==="kata"){kataOpen=sheet.name;sheet=null;$("#sheetWrap").hidden=true;}document.body.style.overflow=sheet&&!wide()?"hidden":"";if(sheet)renderSheet();else{$("#sheet").innerHTML=wide()?paneEmpty():"";}render();});
["input","change"].forEach(ev=>document.addEventListener(ev,e=>{if(sheet&&(sheet.type==="form"||sheet.type==="aform")&&e.target.closest&&e.target.closest("#noteForm,#assignForm"))sheet.dirty=true;}));
window.addEventListener("popstate",()=>{
  if(exitArmed)return; // second Back on the home screen: let the app close
  if(sheet)closeSheet();
  else if(tab==="kata"&&kataOpen){kataOpen=null;kiaiOpen=false;render();window.scrollTo(0,0);}
  else if(tab!=="notes"){tab="notes";kataOpen=null;LS.set("tab","notes");render();window.scrollTo(0,0);}
  else{exitArmed=true;toast("Press back again to close");clearTimeout(exitT);exitT=setTimeout(()=>{exitArmed=false;guardBack();},2800);return;}
  guardBack();
});
guardBack();

/* ---------- press feedback ----------
   Taps usually redraw the screen, so the ring is replayed on the redrawn copy of the same button. */
const TAP_SEL="button,.tile,.pillr,a.btn";
let lastTap=null;
const tapTarget=el=>el.matches(".tile,.pillr")?el.querySelector("span")||el:el;
function tapKey(el){const parts=["act","id","v"].filter(k=>el.dataset[k]!=null).map(k=>`[data-${k}="${CSS.escape(el.dataset[k])}"]`);return parts.length?parts.join(""):null;}
function popTap(t){t.classList.remove("tapping","tapped");void t.offsetWidth;t.classList.add("tapped");setTimeout(()=>t.classList.remove("tapped"),460);}
document.addEventListener("pointerdown",e=>{
  const el=e.target.closest(TAP_SEL);if(!el||el.disabled)return;
  const t=tapTarget(el);t.classList.add("tapping");
  const key=tapKey(el),inSheet=!!el.closest("#sheetWrap"),root=inSheet?$("#sheetWrap"):document;
  lastTap={el:t,key,nth:key?[...root.querySelectorAll(key)].indexOf(el):0,inSheet,x:e.clientX,y:e.clientY,at:Date.now()};
},{passive:true});
document.addEventListener("pointermove",e=>{if(lastTap&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)>12){lastTap.el.classList.remove("tapping");lastTap=null;}},{passive:true});
document.addEventListener("pointerup",()=>{if(!lastTap)return;popTap(lastTap.el);lastTap.at=Date.now();},{passive:true});
document.addEventListener("pointercancel",()=>{if(lastTap){lastTap.el.classList.remove("tapping");lastTap=null;}},{passive:true});
function replayTap(){
  if(!lastTap||lastTap.el.isConnected||!lastTap.key||Date.now()-lastTap.at>600)return;
  const root=lastTap.inSheet?$("#sheetWrap"):document;
  const all=root?[...root.querySelectorAll(lastTap.key)]:[];const el=all[lastTap.nth]||all[0];if(el){const t=tapTarget(el);lastTap.el=t;popTap(t);}
}

/* ---------- start ---------- */
function boot(){
  readLinkParams();
  if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(!API||!CLIENT){auth=SESSION&&API?"ok":"signin";}
  if(SESSION&&API){auth="ok";if(loadCache())ready=true;}
  render();
  if(auth==="ok")flush();
}
boot();
})();
</script>
